withDebugLogs: true
withFiniteDifferences: false
#finiteDifferenceStep: 1e-6
withGyroBias: true
withUnmodeledWrench: true
withAccelerationEstimation: true
withDampingInMatrixA: true

contacts:
  # schmittTriggerLowerPropThreshold: 0.100
  # schmittTriggerUpperPropThreshold: 0.150
  #surfacesOfContactsAsInput: [RightHandSupportPlate, LeftHandSupportPlate] # [LeftHandForceSensor]
  #contactSensorsDisabledInit: [] # [LeftHandForceSensor] # [RightFootForceSensor, LeftFootForceSensor]
  contactsDetection: Surfaces
  surfacesForContactDetection: [RightFootCenter, LeftFootCenter, LeftHandCloseContact]

backupInterval: 1

# gains for the Tilt Observer in backup
filterGains:
  finalAlpha: 5 # 5 # 0.0
  finalBeta: 1 # 1 # 0.0 # 0.00001
  finalGamma: 2 # 2 # 0.0
leggedOdometry:
  kappa: 10
  lambdaInf: 0.001
  correctContacts: true
  odometryType: None 	

ekfStateProcessVariances:
  statePositionInitVariance: [0.0,0.0,0.0]
  stateOriInitVariance: [1e-4, 1e-4, 0.0]
  stateLinVelInitVariance: [9.9999999999999998e-13, 9.9999999999999998e-13, 9.9999999999999998e-13]
  stateAngVelInitVariance: [0.0,0.0,0.0]
  gyroBiasInitVariance: [1e-08, 1e-08, 1e-08]
  unmodeledForceInitVariance: [0,0,0]
  unmodeledTorqueInitVariance: [0.0,0.0,0.0]

  contactPositionInitVarianceFirstContacts: [0.0, 0.0, 0.0] # [0.25e-4, 1.0e-4, 0.0] # [0.0,0.0,0.0]
  contactOriInitVarianceFirstContacts: [0.0,0.0,0.0] # 0.007615442 5 degrees # 0.00121847 2 degrees
  contactForceInitVarianceFirstContacts: [400,400,400]
  contactTorqueInitVarianceFirstContacts: [100.0,100.0,100.0]

  contactPositionInitVarianceNewContacts: [1e-05, 1e-05, 1e-05] # [0.25e-4, 1.0e-4, 0.0] # [0.25e-4, 1.0e-4, 0.0] # [0.0,0.0,0.0]
  contactOriInitVarianceNewContacts: [0.000304617419787, 0.000304617419787, 0.000304617419787] # 0.00121847 # 0.007615442 5 degrees # 0.00121847 2 degrees # 3e-4 = 1 degree
  contactForceInitVarianceNewContacts: [400, 400, 400]
  contactTorqueInitVarianceNewContacts: [360, 360, 360]

  statePositionProcessVariance: [1e-10, 1e-10, 1e-10]
  stateOriProcessVariance: [1e-12, 1e-12, 1e-12]
  stateLinVelProcessVariance: [1e-10, 1e-10, 1e-10]
  stateAngVelProcessVariance: [1e-12, 1e-12, 1e-12]
  gyroBiasProcessVariance: [1e-18, 1e-18, 1e-18] # [1e-12,1e-12,1e-12]
  unmodeledForceProcessVariance: [0.09, 0.09, 0.09]
  unmodeledTorqueProcessVariance: [0.05, 0.05, 0.05]
  contactPositionProcessVariance: [1e-09, 1e-09, 1e-10] # [0.25e-4, 1.0e-4, 1e-8] # 1e-12: equivalent to 0.2mm in one second for dt = 0.005
  contactOrientationProcessVariance: [0, 0, 1e-08]  # [0.0,0.0,0.0] # [1e-8,1e-8,1e-8] # 0.00121847 # square of 2 degrees # 0.000304618 # square of 1 degree
  contactForceProcessVariance: [10000, 10000, 10000]
  contactTorqueProcessVariance: [2500, 2500, 2500]

# Load-weighted adaptive contact process covariance. Exponent 1 weights each contact by its
# share of the measured normal force, so a lightly loaded (slipping) foot no longer drags
# the anchor average as hard as a fully loaded one. 0 reproduces the uniform mean.
contactCovLoadWeightExponent: 1.0

# Coulomb limit on the tangential contact force (see setContactFrictionCoefficient).
contactFrictionCoefficient: 0.8
