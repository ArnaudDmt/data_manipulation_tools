contacts:
  contactsDetection: Surfaces
  surfacesForContactDetection: [RightFootCenter, LeftFootCenter, LeftHandCloseContact]
  # contactSensorsIgnored: [LeftHandForceSensor]
  # Flexibilities of contacts
  linStiffness: [3e5, 3e5, 3e5] # [0, 0, 0] # [4e4, 4e4, 4e4]
  angStiffness: [1000, 1000, 1000] # [0, 0, 0] # [727, 727, 727]
  linDamping: [150, 150, 150] # [0.0,0.0,0.0] # [65.76, 65.76, 65.76]  # [65.76, 65.76, 65.76] #critical damping # [250, 250, 250]
  angDamping: [17, 17, 17] # [0.0,0.0,0.0] # [17, 17, 17]
ekfSensorNoiseVariances:
  gyroSensorVariance: [2.5e-7,2.5e-7,2.5e-7]
  acceleroSensorVariance: [2.5e-3,2.5e-3,2.5e-3]
  # Identified from the unloaded sensor noise floor: sigma = 0.7 N per axis (was 1e0).
  forceSensorVariance: [5e-1, 5e-1, 5e-1] # [9e90,9e90,9e90] # [9e1,9e1,9e1]
  torqueSensorVariance: [9e-4, 9e-4, 9e-4] # [9e90,9e90,9e90] # [3e1,3e1,3e1]
  positionSensorVariance: [0.0,0.0,0.0]
  orientationSensorVariance: [0.0,0.0,0.0]


linStiffness: [3e5, 3e5, 3e5] # [0, 0, 0] # [4e4, 4e4, 4e4]
angStiffness: [1000, 1000, 1000] # [0, 0, 0] # [727, 727, 727]
linDamping: [150, 150, 150] # [0.0,0.0,0.0] # [65.76, 65.76, 65.76]  # [65.76, 65.76, 65.76] #critical damping # [250, 250, 250]
angDamping: [17, 17, 17] # [0.0,0.0,0.0] # [17, 17, 17]
# The hand load cell is far quieter than the feet -- sigma 0.1 N and 0.005 N.m against the
# feet's 0.7 N and 0.03 N.m -- and it is genuinely at rest when unloaded, where a foot is
# only ever unloaded mid-swing. Without this it inherits the foot calibration, 100x too
# loose on force and 36x on torque.
sensorPerContact:
  LeftHandCloseContact:
    forceSensorVariance: [1e-2, 1e-2, 1e-2]
    torqueSensorVariance: [2.5e-5, 2.5e-5, 2.5e-5]
