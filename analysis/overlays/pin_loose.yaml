# Pin released AND the rest-pose process covariance opened to where slip actually lives.
# The horizontal terms go from 1e-9 (about 6 mm/s of permitted rest-pose motion at 5 ms) to 1e-6
# (about 200 mm/s). The earlier cell analysis found no-slip accuracy flat from 1e-9 to 1e-6 across
# 1133 evaluations, so this should cost nothing while the feet hold. The vertical term is left
# alone. This combination was never testable before: with the pin in place the parameter had no
# effect during single support, which is 52-56% of the slippage runs.
settings:
  free_single_contact_rest_pose: true
covariances:
  contact_process: [1.0e-06, 1.0e-06, 1.0e-10, 0.0, 0.0, 1.0e-08, 10000.0, 10000.0, 10000.0, 2500.0, 2500.0, 2500.0]
