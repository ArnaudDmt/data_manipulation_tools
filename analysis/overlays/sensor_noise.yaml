# Measured sensor noise, white component only, taken while the sensor is unloaded so that neither
# uncompensated link gravity (slow) nor impacts (loaded) contaminate it.
#
#   HRP5P feet : torque sigma 0.028 - 0.063 N.m  -> variance 8e-4 .. 4e-3, configured 9e-4 sits at
#                the floor of the measured range; 2.5e-3 is its centre (x2.78).
#   hand       : torque sigma 0.057 - 0.113 N.m  -> variance 3e-3 .. 1.3e-2, i.e. 2-4x the feet,
#                yet it currently shares their covariance. 7e-3 is the centre.
#   force      : measured 0.68 - 1.41 N on every sensor, so the configured 1.0 is already right
#                and is left alone.
covariance_scales:
  contact_wrench: [1.0, 1.0, 1.0, 2.78, 2.78, 2.78]
covariances_per_contact:
  LeftHandCloseContact:
    contact_wrench: [1.0, 1.0, 1.0, 7.0e-3, 7.0e-3, 7.0e-3]
