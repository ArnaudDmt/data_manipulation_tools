contacts:
  contactsDetection: Surfaces
  # Declared HERE, inside `contacts:`, and not only at the root below. MCKineticsObserver reads the
  # flexibilities through `config("contacts")` (MCKineticsObserver.cpp:187-190) and nowhere else,
  # and mc_rtc layers the package's own etc/MCKineticsObserver/robots/rhps1.yaml -- which declares
  # them inside `contacts:` -- UNDER this file. A root-level declaration therefore never overrides
  # the package's, which is why the flexibility variants came out inert on every RHPS1 dataset on
  # 2026-09-17: scale_flexibilities rewrote keys the observer does not read. The values are the
  # package's own, so the reference results are unchanged and stay comparable.
  linStiffness: [3e4, 3e4, 3e4]
  angStiffness: [727, 727, 727]
  linDamping: [150, 150, 150]
  angDamping: [17, 17, 17]
  surfacesForContactDetection: [RightFootCenter, LeftFootCenter] # [LeftHandCloseContact] 
  #contactSensorsIgnored: [LeftHandForceSensor] # [LeftHandForceSensor]

ekfSensorNoiseVariances:
  gyroSensorVariance: [1.6e-5,1.6e-5,1.6e-5]
  acceleroSensorVariance: [3.6e-3,3.6e-3,3.6e-3]
  forceSensorVariance: [1e0, 1e0, 1e0] # [9e90,9e90,9e90] # [9e1,9e1,9e1]
  # Identified from the unloaded sensor noise floor: sigma = 0.03 N.m per axis,
  # measured on both feet across five walks (was 1e-2, i.e. 12x too loose).
  torqueSensorVariance: [9e-4, 9e-4, 9e-4] # [9e90,9e90,9e90] # [3e1,3e1,3e1]
  positionSensorVariance: [0.0,0.0,0.0]
  orientationSensorVariance: [0.0,0.0,0.0]
  
# Flexibilities of contacts
linStiffness: [3e4, 3e4, 3e4] # [0, 0, 0] # [4e4, 4e4, 4e4]
angStiffness: [727, 727, 727] # [0, 0, 0] # [727, 727, 727]
linDamping: [150, 150, 150] # [0.0,0.0,0.0] # [65.76, 65.76, 65.76]  # [65.76, 65.76, 65.76] #critical damping # [250, 250, 250]
angDamping: [17, 17, 17] # [0.0,0.0,0.0] # [17, 17, 17]
# Foot force-sensor calibration: a rotation vector (rad) in each contact frame, applied to the
# measured force only. Identified from single support, where the whole ground reaction passes
# through one foot and must therefore be vertical: the measured force sits 18-19 deg off
# vertical in a direction fixed to each foot, consistent to 1 deg across all eight RHPS1
# datasets, giving 147 N of net horizontal force while the robot stands still. The torque is
# left alone -- its centre of pressure is already inside the sole.
wrenchCalibration:
  LeftFootCenter:  [0.047962, 0.324858, 0.015621]
  RightFootCenter: [-0.282761, 0.142506, 0.001466]
